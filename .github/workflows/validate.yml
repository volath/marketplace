name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: marketplace
      - uses: actions/checkout@v4
        with:
          repository: volath/sdk
          path: sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
        working-directory: marketplace
